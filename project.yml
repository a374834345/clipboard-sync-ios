name: ClipboardSync
options:
  bundleIdPrefix: com.clipboardsync
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: zh-Hans
  xcodeVersion: "15.0"
  deploymentType: "project"
  createIntermediateGroups: true
  minimumXcodeGenVersion: "2.38.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGN_IDENTITY: ""
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTS_MACCATALYST: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  ClipboardSync:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/ClipboardSync
    resources:
      - path: Resources/Info.plist
        type: file
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: 剪贴板同步
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: ""
        UIBackgroundModes:
          - fetch
          - processing
          - remote-notification
        BGTaskSchedulerPermittedIdentifiers:
          - com.clipboardsync.refresh
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSCameraUsageDescription: "拍摄照片作为 App 自定义封面（仅保存在本机，不上传任何服务器）"
        NSPhotoLibraryUsageDescription: "从相册选择图片作为 App 自定义封面（仅保存在本机，不上传任何服务器）"
        NSPhotoLibraryAddUsageDescription: "如需保存封面到相册时会请求授权"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.clipboardsync.app
        PRODUCT_NAME: ClipboardSync
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/ClipboardSync.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
