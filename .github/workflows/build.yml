name: Build IPA

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  SCHEME: ClipboardSync
  PROJECT_DIR: .   # 仓库里 iOS_ClipboardSync 作为根目录

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          xcodegen generate
          # xcodegen 默认生成 objectVersion=77（Xcode 16），老 Xcode 打不开。
          # 强制降级 project.pbxproj 为 Xcode 14 兼容的 objectVersion=56
          PBXPROJ="${SCHEME}.xcodeproj/project.pbxproj"
          if [ -f "$PBXPROJ" ]; then
            sed -i '' -E 's/(objectVersion = )[0-9]+/\156/' "$PBXPROJ"
            sed -i '' -E 's/(archiveVersion = )[0-9]+/\11/' "$PBXPROJ"
            # classes 区域加个兼容标记（SwiftUI/Xcode 15 build 需要）
            sed -i '' -E 's/(classes = ){}/\1\n\t\t\t/' "$PBXPROJ" || true
            echo "已降级工程格式："
            head -n 5 "$PBXPROJ"
          fi

      - name: Build Release (unsigned, iphoneos)
        run: |
          set -eo pipefail
          xcodebuild \
            -project "${SCHEME}.xcodeproj" \
            -scheme "${SCHEME}" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            -derivedDataPath build \
            build 2>&1 | tee build.log
          echo "=== 查找 .app 路径 ==="
          find build/Build/Products -name "${SCHEME}.app" -type d

      - name: Package IPA
        run: |
          set -euo pipefail
          APP_PATH=$(find build/Build/Products -name "${SCHEME}.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "❌ 找不到 ${SCHEME}.app，打印构建日志末尾："
            tail -n 120 build.log
            exit 1
          fi
          # 确认 .app 内有可执行文件
          EXEC="$APP_PATH/${SCHEME}"
          if [ ! -f "$EXEC" ]; then
            echo "❌ .app 存在但里面没有可执行文件 ${EXEC}（说明编译失败但 tee 吞了退出码）"
            echo ".app 目录："
            ls -lhR "$APP_PATH" | head -40
            echo
            echo "构建日志尾部："
            tail -n 120 build.log
            exit 1
          fi
          echo "✅ 找到 .app（大小 $(du -sh "$APP_PATH" | cut -f1)）"
          file "$EXEC"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          # 写入 TrollStore 元数据
          : > "Payload/${SCHEME}.app/TrollStore.RoothideHash" || true
          zip -rq "${SCHEME}.ipa" Payload
          rm -rf Payload
          ls -lh "${SCHEME}.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClipboardSync-ipa
          path: ClipboardSync.ipa
          retention-days: 30
